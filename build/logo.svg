<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="100%" stop-color="#0047A5" />
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4F8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- 메인 배경 둥근 사각형 타일 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 스마트 에듀 카드 본체 -->
  <rect x="96" y="116" width="320" height="280" rx="36" fill="url(#tagGrad)" filter="drop-shadow(0 16px 32px rgba(0,20,60,0.3))"/>

  <!-- 카드 상단 마그네틱/헤더 밴드 -->
  <path d="M96 152a36 36 0 0 1 36-36h248a36 36 0 0 1 36 36v28H96v-28z" fill="#0052BA"/>

  <!-- 스마트 IC 칩 / 학급 태그 심볼 -->
  <rect x="136" y="210" width="76" height="60" rx="12" fill="#FFB300"/>
  <rect x="152" y="222" width="44" height="36" rx="6" fill="#FFA000"/>

  <!-- 학생/클래스 라인 패턴 -->
  <rect x="236" y="216" width="140" height="16" rx="8" fill="#B0BEC5"/>
  <rect x="236" y="246" width="96" height="14" rx="7" fill="#CFD8DC"/>
  <rect x="136" y="316" width="240" height="14" rx="7" fill="#E2E8F0"/>
  <rect x="136" y="344" width="160" height="14" rx="7" fill="#E2E8F0"/>

  <!-- NFC 무선 전파 & 과학 탐구 웨이브 (우측 상단으로 뻗어나가는 빛나는 웨이브) -->
  <g transform="translate(320, 70)" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M20 50 A 45 45 0 0 1 55 85" />
    <path d="M35 25 A 80 80 0 0 1 95 85" />
    <path d="M50 0 A 115 115 0 0 1 135 85" />
  </g>

  <!-- 과학 탐구 빛나는 별/스파크 -->
  <circle cx="440" cy="140" r="10" fill="#00E676"/>
</svg>
